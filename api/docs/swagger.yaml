basePath: /
definitions:
  drop_internal_auth.InvitationInfo:
    properties:
      accepted_at:
        type: string
      created_at:
        type: string
      email:
        example: nuevo@ejemplo.com
        type: string
      expires_at:
        type: string
      id:
        example: 1
        type: integer
      role:
        allOf:
        - $ref: '#/definitions/drop_internal_model.Role'
        enum:
        - admin
        - user
        example: user
      status:
        allOf:
        - $ref: '#/definitions/drop_internal_model.InvitationStatus'
        enum:
        - pending
        - accepted
        - expired
        - revoked
        example: pending
    type: object
  drop_internal_auth.UserInfo:
    properties:
      active:
        example: true
        type: boolean
      created_at:
        type: string
      email:
        example: admin@drop.local
        type: string
      id:
        example: 1
        type: integer
      last_login_at:
        type: string
      name:
        example: Admin
        type: string
      role:
        allOf:
        - $ref: '#/definitions/drop_internal_model.Role'
        enum:
        - admin
        - user
        example: admin
    type: object
  drop_internal_model.InvitationStatus:
    enum:
    - pending
    - accepted
    - expired
    - revoked
    type: string
    x-enum-varnames:
    - InvitationPending
    - InvitationAccepted
    - InvitationExpired
    - InvitationRevoked
  drop_internal_model.Kind:
    enum:
    - folder
    - drop
    type: string
    x-enum-varnames:
    - KindFolder
    - KindDrop
  drop_internal_model.Role:
    enum:
    - admin
    - user
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleUser
  drop_internal_model.Visibility:
    enum:
    - public
    - unlisted
    - private
    type: string
    x-enum-varnames:
    - VisibilityPublic
    - VisibilityUnlisted
    - VisibilityPrivate
  drop_internal_service.Access:
    enum:
    - ""
    - viewer
    - editor
    - owner
    type: string
    x-enum-varnames:
    - AccessNone
    - AccessViewer
    - AccessEditor
    - AccessOwner
  drop_internal_service.DropDetail:
    properties:
      access:
        allOf:
        - $ref: '#/definitions/drop_internal_service.Access'
        description: |-
          Access is what the caller may do with it: owner, editor or viewer. The
          interface hides the actions it does not cover.
        enum:
        - owner
        - editor
        - viewer
        example: owner
      entrypoint_missing:
        description: |-
          EntrypointMissing marks a drop whose entrypoint names no file it holds.
          Its URL answers 404 until a page by that name arrives, or the metadata
          is pointed at one that exists.
        example: false
        type: boolean
      files:
        items:
          $ref: '#/definitions/drop_internal_service.FileInfo'
        type: array
      kind:
        allOf:
        - $ref: '#/definitions/drop_internal_model.Kind'
        enum:
        - folder
        - drop
        example: drop
      meta:
        $ref: '#/definitions/drop_internal_service.DropMeta'
      name:
        example: arquitectura
        type: string
      owner:
        description: |-
          Owner is whose drive it lives in. A path only identifies a node together
          with this, since every user has their own tree.
        example: 1
        type: integer
      path:
        example: proyectos/arquitectura
        type: string
      url:
        description: |-
          URL is where the drop can be opened. Serving it is subject to
          visibility: a private drop answers there only for the accounts that may
          open it, and 404s for everyone else.
        example: http://localhost:8000/d/An1UHNyp/
        type: string
      versions:
        description: Versions is the publication history, newest first.
        items:
          $ref: '#/definitions/drop_internal_service.VersionInfo'
        type: array
    type: object
  drop_internal_service.DropMeta:
    properties:
      created_at:
        type: string
      entrypoint:
        example: index.html
        type: string
      slug:
        example: An1UHNyp
        type: string
      title:
        example: Arquitectura del sistema
        type: string
      updated_at:
        type: string
      version:
        description: |-
          Version is the sequence number of the snapshot currently published: 1 on
          first upload, and one more each time the drop is uploaded again.
        example: 3
        type: integer
      visibility:
        allOf:
        - $ref: '#/definitions/drop_internal_model.Visibility'
        enum:
        - public
        - unlisted
        - private
        example: public
    type: object
  drop_internal_service.FileInfo:
    properties:
      content_type:
        example: text/html
        type: string
      generated:
        description: |-
          Generated marks a file the system maintains — the ".drop" descriptor.
          It can be listed and read, but not written or deleted through the API.
        example: false
        type: boolean
      modified_at:
        type: string
      name:
        example: index.html
        type: string
      size:
        example: 1024
        type: integer
    type: object
  drop_internal_service.Node:
    properties:
      kind:
        allOf:
        - $ref: '#/definitions/drop_internal_model.Kind'
        enum:
        - folder
        - drop
        example: drop
      name:
        example: arquitectura
        type: string
      owner:
        description: |-
          Owner is whose drive it lives in. A path only identifies a node together
          with this, since every user has their own tree.
        example: 1
        type: integer
      path:
        example: proyectos/arquitectura
        type: string
    type: object
  drop_internal_service.VersionInfo:
    properties:
      current:
        description: Current marks the version served at the drop's own URL.
        example: true
        type: boolean
      entrypoint:
        example: index.html
        type: string
      files:
        example: 3
        type: integer
      published_at:
        type: string
      seq:
        example: 2
        type: integer
      size:
        example: 20480
        type: integer
      url:
        description: URL pins this snapshot, and keeps working after later uploads.
        example: http://localhost:8000/d/An1UHNyp/@2/
        type: string
    type: object
  internal_httpapi.ActivateVersionRequest:
    properties:
      seq:
        example: 2
        type: integer
    required:
    - seq
    type: object
  internal_httpapi.CreateDropRequest:
    properties:
      entrypoint:
        example: index.html
        type: string
      name:
        example: arquitectura
        type: string
      parent:
        example: proyectos
        type: string
      title:
        example: Arquitectura del sistema
        type: string
      visibility:
        allOf:
        - $ref: '#/definitions/drop_internal_model.Visibility'
        enum:
        - public
        - unlisted
        - private
        example: public
    required:
    - name
    type: object
  internal_httpapi.CreateFolderRequest:
    properties:
      name:
        example: clientes
        type: string
      parent:
        example: proyectos
        type: string
    required:
    - name
    type: object
  internal_httpapi.CreateInvitationRequest:
    properties:
      email:
        example: nuevo@ejemplo.com
        type: string
      role:
        allOf:
        - $ref: '#/definitions/drop_internal_model.Role'
        enum:
        - admin
        - user
        example: user
    required:
    - email
    type: object
  internal_httpapi.CreateInvitationResponse:
    properties:
      invitation:
        $ref: '#/definitions/drop_internal_auth.InvitationInfo'
      token:
        type: string
      url:
        description: URL is the link to hand over. No email is sent in this version.
        example: http://localhost:8000/invitacion?token=…
        type: string
    type: object
  internal_httpapi.ErrorResponse:
    properties:
      code:
        example: not_found
        type: string
      message:
        example: resource not found
        type: string
    type: object
  internal_httpapi.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  internal_httpapi.InvitationsResponse:
    properties:
      invitations:
        items:
          $ref: '#/definitions/drop_internal_auth.InvitationInfo'
        type: array
    type: object
  internal_httpapi.ListResponse:
    properties:
      children:
        items:
          $ref: '#/definitions/drop_internal_service.Node'
        type: array
      path:
        example: proyectos
        type: string
    type: object
  internal_httpapi.LoginRequest:
    properties:
      email:
        example: admin@drop.local
        type: string
      password:
        example: admin
        type: string
    required:
    - email
    - password
    type: object
  internal_httpapi.PatchDropRequest:
    properties:
      entrypoint:
        example: index.html
        type: string
      title:
        example: Arquitectura v2
        type: string
      visibility:
        allOf:
        - $ref: '#/definitions/drop_internal_model.Visibility'
        enum:
        - public
        - unlisted
        - private
        example: unlisted
    type: object
  internal_httpapi.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_httpapi.SetUserActiveRequest:
    properties:
      active:
        example: false
        type: boolean
    required:
    - active
    type: object
  internal_httpapi.TokenResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      refresh_expires_at:
        type: string
      refresh_token:
        type: string
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/drop_internal_auth.UserInfo'
    type: object
  internal_httpapi.UploadResponse:
    properties:
      files:
        items:
          $ref: '#/definitions/drop_internal_service.FileInfo'
        type: array
    type: object
  internal_httpapi.UsersResponse:
    properties:
      users:
        items:
          $ref: '#/definitions/drop_internal_auth.UserInfo'
        type: array
    type: object
  internal_httpapi.VersionsResponse:
    properties:
      path:
        example: proyectos/arquitectura
        type: string
      versions:
        items:
          $ref: '#/definitions/drop_internal_service.VersionInfo'
        type: array
    type: object
info:
  contact: {}
  description: |-
    Admin API for Drop: a Drive-like tree where any folder holding a `.drop` descriptor is a publishable drop. Metadata lives in SQL; file bytes live in MinIO.
    Every endpoint outside /v1/auth needs a token. Get one from POST /v1/auth/login and send it as `Authorization: Bearer <token>`.
  title: Drop Admin API
  version: "1.0"
paths:
  /d/{slug}/{filepath}:
    get:
      description: Serves a drop's content by slug. Without a path the drop's entrypoint
        is returned; with one, that file. A leading `@<seq>` segment pins an older
        version, so `/d/{slug}/@2/` keeps serving what version 2 published. A private
        drop answers only for the accounts that may open it — its owner and whoever
        it is shared with, by session cookie or bearer token — and 404s for everyone
        else, so the response never reveals that the slug exists.
      parameters:
      - description: Drop slug
        example: An1UHNyp
        in: path
        name: slug
        required: true
        type: string
      - description: File inside the drop; defaults to the entrypoint
        example: assets/app.css
        in: path
        name: filepath
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
      summary: Open a published drop
      tags:
      - public
  /healthz:
    get:
      description: Returns ok when the API process is up.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpapi.HealthResponse'
      summary: Liveness probe
      tags:
      - operation
  /v1/auth/login:
    post:
      consumes:
      - application/json
      description: Exchanges email and password for an access token and the refresh
        token that renews it. Rate limited per client address.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_httpapi.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpapi.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
      summary: Open a session
      tags:
      - auth
  /v1/auth/logout:
    post:
      consumes:
      - application/json
      description: 'Revokes the session behind a refresh token. Answers 204 whether
        or not the token was recognized: signing out is not a place to learn which
        tokens are real.'
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_httpapi.RefreshRequest'
      produces:
      - application/json
      responses:
        "204":
          description: revoked
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
      summary: Close a session
      tags:
      - auth
  /v1/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/drop_internal_auth.UserInfo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Describe the caller
      tags:
      - auth
  /v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a refresh token for a fresh access token. The refresh
        token itself keeps working until it expires or its session is revoked.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_httpapi.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpapi.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
      summary: Renew an access token
      tags:
      - auth
  /v1/drops:
    get:
      description: Returns a drop's metadata and the files it is composed of.
      parameters:
      - description: Drop path
        example: proyectos/arquitectura
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/drop_internal_service.DropDetail'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
      summary: Get a drop
      tags:
      - drops
    patch:
      consumes:
      - application/json
      description: Patches title, visibility, or entrypoint and refreshes the drop's
        `.drop` descriptor.
      parameters:
      - description: Drop path
        example: proyectos/arquitectura
        in: query
        name: path
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_httpapi.PatchDropRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/drop_internal_service.DropDetail'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
      summary: Update drop metadata
      tags:
      - drops
    post:
      consumes:
      - application/json
      description: 'Creates a drop: a node carrying metadata plus a materialized `.drop`
        YAML descriptor in object storage.'
      parameters:
      - description: Drop to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_httpapi.CreateDropRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/drop_internal_service.DropDetail'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
      summary: Create a drop
      tags:
      - drops
  /v1/drops/upload:
    post:
      consumes:
      - multipart/form-data
      description: Creates a drop and uploads its files in a single multipart request.
        Repeat the `file` field once per file. To place files in subdirectories, repeat
        a `path` field as well — the Nth `path` names the Nth `file` — because RFC
        7578 forbids directory information in a part's filename. Everything is validated
        before any byte is stored, and a failed upload rolls the whole drop back.
      parameters:
      - description: Drop title
        example: Arquitectura del sistema
        in: formData
        name: title
        required: true
        type: string
      - description: File(s) that compose the drop
        in: formData
        name: file
        required: true
        type: file
      - description: Relative path for each file, in the same order as `file`
        example: assets/app.css
        in: formData
        name: path
        type: string
      - description: 'Page to open. Inferred when omitted: the only HTML uploaded,
          whatever its name, or index.html when there are several'
        example: index.html
        in: formData
        name: entrypoint
        type: string
      - description: public (default), unlisted or private
        enum:
        - public
        - unlisted
        - private
        in: formData
        name: visibility
        type: string
      - description: Destination folder; defaults to the root
        example: Proyectos
        in: formData
        name: parent
        type: string
      - description: Folder name; defaults to a slug of the title
        example: arquitectura
        in: formData
        name: name
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/drop_internal_service.DropDetail'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
      summary: Create a drop with its files
      tags:
      - drops
  /v1/drops/versions:
    get:
      description: Returns the drop's publication history, newest first. Each entry
        carries a URL that keeps serving that snapshot even after later uploads.
      parameters:
      - description: Drop path
        example: proyectos/arquitectura
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpapi.VersionsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
      summary: List a drop's versions
      tags:
      - drops
  /v1/drops/versions/activate:
    post:
      consumes:
      - application/json
      description: 'Points the drop''s URL back at an earlier snapshot. Nothing is
        deleted: the history keeps every version, including the one that was current.'
      parameters:
      - description: Drop path
        example: proyectos/arquitectura
        in: query
        name: path
        required: true
        type: string
      - description: Version to republish
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_httpapi.ActivateVersionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/drop_internal_service.DropDetail'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
      summary: Republish an earlier version
      tags:
      - drops
  /v1/files:
    delete:
      description: Removes one file from a drop.
      parameters:
      - description: Full path of the file
        example: proyectos/arquitectura/index.html
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: deleted
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
      summary: Delete a file
      tags:
      - files
    get:
      description: Streams a file stored inside a drop.
      parameters:
      - description: Full path of the file
        example: proyectos/arquitectura/index.html
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
      summary: Download a file
      tags:
      - files
    post:
      consumes:
      - multipart/form-data
      description: Stores one or more files inside a drop. Send them as multipart/form-data
        under the `file` field; an existing file of the same name is replaced.
      parameters:
      - description: Drop path
        example: proyectos/arquitectura
        in: query
        name: path
        required: true
        type: string
      - description: File(s) to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_httpapi.UploadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
      summary: Upload files to a drop
      tags:
      - files
  /v1/invitations:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpapi.InvitationsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List invitations
      tags:
      - invitations
    post:
      consumes:
      - application/json
      description: 'Issues a single-use link. There is no public sign-up and no email
        is sent: the link is returned here, once, and handed over by whatever channel
        you like. Only its hash is stored.'
      parameters:
      - description: Who to invite
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_httpapi.CreateInvitationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_httpapi.CreateInvitationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Invite someone
      tags:
      - invitations
  /v1/invitations/{id}:
    delete:
      description: Cancels a pending invitation, so its link stops working.
      parameters:
      - description: Invitation id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/drop_internal_auth.InvitationInfo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke an invitation
      tags:
      - invitations
  /v1/nodes:
    delete:
      description: Deletes the node and everything beneath it, including the stored
        files of every drop in the subtree.
      parameters:
      - description: Path of the node to delete
        example: proyectos/arquitectura
        in: query
        name: path
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: deleted
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
      summary: Delete a folder or drop
      tags:
      - nodes
    get:
      description: Lists the direct children of a folder. An empty path lists the
        root. Returns 409 `is_drop` when the path is a drop — fetch it via /v1/drops
        instead.
      parameters:
      - description: Folder path; empty means the root
        example: proyectos
        in: query
        name: path
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpapi.ListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
      summary: List folders and drops
      tags:
      - nodes
    post:
      consumes:
      - application/json
      description: Creates a plain organizational folder inside another folder.
      parameters:
      - description: Folder to create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_httpapi.CreateFolderRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/drop_internal_service.Node'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
      summary: Create a folder
      tags:
      - nodes
  /v1/users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpapi.UsersResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List accounts
      tags:
      - users
  /v1/users/{id}:
    delete:
      description: Soft-deletes the account and revokes its sessions. The address
        becomes free to invite again.
      parameters:
      - description: User id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: deleted
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an account
      tags:
      - users
  /v1/users/{id}/active:
    patch:
      consumes:
      - application/json
      description: Disabling also revokes the user's sessions, so it takes effect
        at once rather than whenever their access token expires.
      parameters:
      - description: User id
        in: path
        name: id
        required: true
        type: integer
      - description: Desired state
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_httpapi.SetUserActiveRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/drop_internal_auth.UserInfo'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_httpapi.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Enable or disable an account
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: RS256 access token, as `Bearer <token>`.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
