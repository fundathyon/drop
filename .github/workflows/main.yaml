name: Main Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  # 🛠️ Build and push the API image
  build-api:
    uses: ./.github/workflows/_build.yaml
    with:
      environment: production
      image_name: drop-api
      target: api
    secrets: inherit

  # 🛠️ Build and push the frontend image
  build-web:
    uses: ./.github/workflows/_build.yaml
    with:
      environment: production
      image_name: drop-web
      target: web
    secrets: inherit
